<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mete Run Download Manager</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #fffdf7 0%, #eef7ff 55%, #fbf8f1 100%);
      font-family: Inter, Arial, sans-serif;
    }
    #autoMetaFloatingRoot {
      position: fixed;
      inset: 18px;
      overflow: hidden;
      border-radius: 18px;
    }
    @media (max-width: 720px) {
      #autoMetaFloatingRoot { inset: 8px; }
    }
  </style>
</head>
<body>
  <div id="autoMetaFloatingRoot"></div>
  <script type="module" src="js/download-manager.js"></script>
</body>
</html>
