<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose Save Folder</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: #f7f1e8;
      color: #111827;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: #fffdf8;
      border: 1px solid #eadfce;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(17, 24, 39, 0.12);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #5b6472; line-height: 1.45; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      background: #155eef;
      color: white;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }
    .status { margin-top: 14px; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose Save Folder</h1>
    <p>Select the folder where Auto Meta should save generated videos and images.</p>
    <button id="chooseBtn">Choose Folder</button>
    <div id="status" class="status"></div>
  </div>
  <script type="module" src="js/folder-picker.js"></script>
</body>
</html>
